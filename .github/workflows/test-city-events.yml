name: Validate city event readers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/sync_events_from_sources.py"
      - "scripts/test_city_event_intake.py"
      - "scripts/finalize_rishon_quality.py"
      - "scripts/repair_rishon_public_quality.py"
      - "scripts/test_rishon_editorial.py"
      - "scripts/sync_ashdod_supplemental.py"
      - "scripts/test_ashdod_supplemental_safety.py"
      - ".github/workflows/test-city-events.yml"
  push:
    branches: [main]
    paths:
      - "scripts/sync_events_from_sources.py"
      - "scripts/test_smarticket_details.py"
      - "scripts/enrich_smarticket_event_details.py"
      - "scripts/enrich_events_institutions.py"
      - "scripts/test_institution_enrichment.py"
      - "events-preview/ashdod/data/institutions.json"
      - "events-preview/rishon-lezion/data/institutions.json"
      - "scripts/ofek_event_source.py"
      - "scripts/test_ofek_event_source.py"
      - "scripts/test_city_event_intake.py"
      - "scripts/finalize_rishon_quality.py"
      - "scripts/repair_rishon_public_quality.py"
      - "scripts/test_rishon_editorial.py"
      - "scripts/sync_ashdod_supplemental.py"
      - "scripts/test_ashdod_supplemental_safety.py"
      - ".github/workflows/test-city-events.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser libraries
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Compile and test calendar readers
        run: |
          python -m py_compile scripts/sync_events_from_sources.py scripts/enrich_smarticket_event_details.py scripts/enrich_events_institutions.py
          python scripts/test_city_event_intake.py
          python scripts/test_ofek_event_source.py
          python scripts/test_smarticket_details.py
          python scripts/test_institution_enrichment.py
          python scripts/test_rishon_editorial.py
          python scripts/test_ashdod_supplemental_safety.py
