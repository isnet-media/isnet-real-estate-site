name: Validate shared stage candidate filters
on:
  push:
    branches:
      - 'fix/stage-candidate-non-event-links-20261029-1552'
    paths:
      - 'scripts/build_shared_stage_productions.py'
      - 'scripts/test_shared_stage_productions.py'
      - '.github/workflows/stage-candidate-validation.yml'
  pull_request:
    paths:
      - 'scripts/build_shared_stage_productions.py'
      - 'scripts/test_shared_stage_productions.py'
      - '.github/workflows/stage-candidate-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate technical-title and stage-title filters
        run: python -m unittest discover -s scripts -p 'test_shared_stage_productions.py' -v
