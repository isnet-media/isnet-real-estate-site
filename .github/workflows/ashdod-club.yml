name: Refresh Ashdod club match data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_ashdod_club.py
      - .github/workflows/ashdod-club.yml
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: ashdod-club-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Jerusalem refresh hour
        id: clock
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          run = os.environ['GITHUB_EVENT_NAME'] != 'schedule' or datetime.now(ZoneInfo('Asia/Jerusalem')).hour in [7,12,14,21,22,23]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(run).lower() + '\n')
          PY
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install HTML parser
        if: steps.clock.outputs.run == 'true'
        run: python -m pip install beautifulsoup4==4.14.2
      - name: Fetch and validate official club sources
        if: steps.clock.outputs.run == 'true'
        run: python scripts/refresh_ashdod_club.py
      - name: Save verified data without overwriting concurrent edits
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'ISNET sports data'
          git config user.email 'sports-data@users.noreply.github.com'
          git add sports/ashdod/data.json sports/ashdod/teams/ms-ashdod.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Ashdod club and opponent data'
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo 'Concurrent data changes detected; preserving remote data and stopping this refresh.'
            exit 1
          fi
          git push origin HEAD:main
