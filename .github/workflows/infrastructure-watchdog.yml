name: ISNET infrastructure watchdog (read only)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: isnet-infrastructure-readiness
  cancel-in-progress: false
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check public websites safely
        run: python scripts/safe_http_probe.py --samples 3 --pause 1
  source-backup-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Confirm daily source bundle is fresh and retained
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_source_backup_freshness.py
