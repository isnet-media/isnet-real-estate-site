name: Record operation failures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/operation-failure-inbox.yml', '.github/scripts/record-operation-failure.cjs', 'scripts/test-operation-failure-inbox.cjs']
  workflow_run:
    workflows: ['**']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: operation-failure-inbox
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            scripts/test-operation-failure-inbox.cjs
          sparse-checkout-cone-mode: false
      - run: node scripts/test-operation-failure-inbox.cjs
  record:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name != 'Record operation failures' &&
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const {record}=require('./.github/scripts/record-operation-failure.cjs');
            await record({github,context,core});
