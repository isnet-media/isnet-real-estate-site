name: Publish priceboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "projects/**"
      - "project-live/**"
      - "יבנה/**"
      - "כרמי-גת/**"
      - "events-preview/**"
      - "culture/**"
      - "meusharim/**"
      - "sports/**"
      - "SUPER.ASHDOD/**"
      - "SUPER.YAVNE/**"
      - "SUPER.KGAT/**"
      - "SUPER.RISHON/**"
      - "SUPER.HOLON/**"
      - "SUPER.BATYAM/**"
      - "scripts/*batyam_super*.py"
      - "scripts/refresh_batyam_super_prices.py"
      - "scripts/super-batyam/**"
      - "scripts/*holon_super*.py"
      - "scripts/refresh_holon_super_prices.py"
      - "scripts/super-holon/**"
      - "scripts/*rishon_super*.py"
      - "scripts/refresh_rishon_super_prices.py"
      - "scripts/super-rishon/**"
      - "scripts/*kgat_super*.py"
      - "scripts/refresh_kgat_super_prices.py"
      - "scripts/super-kgat/**"
      - "scripts/*yavne_super*.py"
      - "scripts/refresh_yavne_super_prices.py"
      - "scripts/super_city_runtime.py"
      - "scripts/super-yavne/**"
      - "scripts/import_super_shufersal.py"
      - "scripts/super-ashdod/shufersal-20261021.json.gz"
      - "scripts/build_super_city_basket.py"
      - "scripts/test_super_homepage.py"
      - "scripts/test_super_live_loading.cjs"
      - "scripts/test_super_city_lists.cjs"
      - "scripts/test_super_product_groups.cjs"
      - "scripts/test_super_comparison_page.cjs"
      - "scripts/test_super_city_basket.py"
      - "scripts/build_super_smart_shopping.py"
      - "scripts/test_super_smart_shopping.cjs"
      - "scripts/build_super_deals.py"
      - "scripts/test_super_deals.py"
      - "scripts/test_super_deals.cjs"
      - "scripts/super-ashdod/city-basket-products.json"
      - "scripts/super-ashdod/city-family-basket.json"
      - "scripts/super_ashdod_shell.py"
      - "scripts/test_super_shell.py"
      - "scripts/build_super_recipes.py"
      - "scripts/sync_event_city_views.py"
      - "scripts/apply_yavne_analytics.py"
      - "scripts/test-yavne-analytics.cjs"
      - "scripts/test-event-date-chips.cjs"
      - "scripts/test-institution-ui.cjs"
      - ".github/workflows/pages.yml"
      - "scripts/qa-pricebooks.cjs"
      - "scripts/prepare-pricebook-sync.py"
      - "scripts/test-pricebook-sync.py"
      - "package*.json"
  workflow_dispatch:
  schedule:
    - cron: "30 7,19 * * *"
  workflow_run:
    workflows:
      - "Refresh Ashdod supermarket prices"
      - "Refresh Yavne supermarket prices"
      - "Refresh Kiryat Gat supermarket prices"
      - "Refresh Rishon supermarket prices"
      - "Refresh Holon supermarket prices"
      - "Refresh Bat Yam supermarket prices"
      - "Import reviewed Ashdod supermarket site"
      - "Normalize event provenance and audit purchase links"
      - "Repair Rishon public quality"
      - "Refresh Ashdod club match data"
      - "Verify and cache Rishon event photos"
      - "Share Ashdod event UI with city editions"
      - "Unified Ashdod and Rishon stage event collection"
      - "Daily city event intake"
      - "Refresh Yavne events"
      - "Build Yavne culinary directory"
      - "Daily Mevalim Ashdod direct event publication"
      - "Daily Ashdod supplemental source publication"
      - "Daily Ashdod local source publication"
      - "Repair Ashdod local source facts"
      - "Discover national event board candidates"
      - "Audit existing Ashdod event subcategories"
      - "Apply verified Ashdod event subcategories"
      - "Refresh Ashdod event source images"
      - "Enrich event content with AI"
      - "Repair event quality automatically"
      - "Refresh verified Ashdod cinema"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node for pricebook checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Ashdod family recipes
        run: python scripts/test_super_recipes.py

      - name: Synchronize city layouts and validate JavaScript
        run: |
          python scripts/sync_event_city_views.py
          python scripts/sync_event_city_views.py --check
          for script in events-preview/ashdod/*.js events-preview/ashdod/pilot/*.js events-preview/rishon-lezion/*.js events-preview/yavne/*.js events-preview/yavne/pilot/*.js; do
            node --check "$script"
          done

      - name: Test compact event date previews
        run: |
          node scripts/test-event-date-chips.cjs
          node scripts/test-ashdod-pilot.cjs
          node scripts/test-yavne-bootstrap.cjs
          node scripts/test-home-loading.cjs

      - name: Verify organizer portals and institution links
        id: institution_audit
        continue-on-error: true
        run: node scripts/test-institution-ui.cjs

      - name: Report event-source QA failure without blocking visual deployment
        if: steps.institution_audit.outcome == 'failure'
        run: |
          echo "::warning title=Event data QA::Organizer/source integrity check failed. Publishing frontend changes only; event data QA remains unresolved."
          echo "### Event data QA: failed (needs separate remediation)" >> "$GITHUB_STEP_SUMMARY"
          echo "The organizer/source integrity test failed. The deployment is allowed to proceed for frontend-only updates; do not treat this as a passing data audit." >> "$GITHUB_STEP_SUMMARY"

      - name: Check sanitized dataset publication
        run: python scripts/test-pricebook-sync.py

      - name: Check pricebook behavior before publication
        run: |
          mkdir -p "$RUNNER_TEMP/pricebook-qa"
          cp package.json package-lock.json "$RUNNER_TEMP/pricebook-qa/"
          npm ci --prefix "$RUNNER_TEMP/pricebook-qa" --ignore-scripts --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/pricebook-qa/node_modules" node scripts/qa-pricebooks.cjs

      - name: Build compact event listings and canonical sitemap
        run: |
          python scripts/test_public_event_assets.py
          python scripts/test_event_seo.py
          node scripts/test-saved-list.cjs
          node scripts/test-ga4-view.cjs
          node scripts/test-event-sync.cjs
          python scripts/build_event_public_assets.py --with-cms
          NODE_PATH="$RUNNER_TEMP/pricebook-qa/node_modules" node scripts/test-category-listings.cjs
          NODE_PATH="$RUNNER_TEMP/pricebook-qa/node_modules" node scripts/test-yavne-quality.cjs
          NODE_PATH="$RUNNER_TEMP/pricebook-qa/node_modules" node scripts/test-hub-listings.cjs

      - name: Build central comparison of public source snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_event_source_history.py

      - name: Rebuild and verify the fixed supermarket comparison baskets
        run: |
          python scripts/test_super_homepage.py
          node scripts/test_super_live_loading.cjs
          node scripts/test_super_city_lists.cjs
          node scripts/test_super_product_groups.cjs
          node scripts/test_super_comparison_page.cjs
          python scripts/import_super_shufersal.py
          python scripts/build_super_city_basket.py
          python scripts/test_super_city_basket.py
          python scripts/build_super_smart_shopping.py
          node scripts/test_super_smart_shopping.cjs
          python scripts/test_super_deals.py
          node scripts/test_super_deals.cjs
          node --check SUPER.ASHDOD/assets/city-basket.js

      - name: Apply shared supermarket header to all current and future pages
        run: |
          python scripts/super_ashdod_shell.py
          python scripts/super_ashdod_shell.py --check
          python scripts/test_super_shell.py

      - name: Build and verify the independent Yavne supermarket edition
        run: |
          pip install beautifulsoup4==4.14.2
          python scripts/build_yavne_super.py
          python scripts/test_yavne_super.py
          for script in SUPER.YAVNE/live.js SUPER.YAVNE/assets/*.js; do node --check "$script"; done

      - name: Verify Kiryat Gat supermarket edition
        run: |
          python scripts/build_kgat_super.py
          python scripts/test_kgat_super.py
          for script in SUPER.KGAT/live.js SUPER.KGAT/assets/*.js; do node --check "$script"; done

      - name: Verify Rishon supermarket edition
        run: |
          python scripts/build_rishon_super.py
          python scripts/test_rishon_super.py
          for script in SUPER.RISHON/live.js SUPER.RISHON/assets/*.js; do node --check "$script"; done

      - name: Verify Holon supermarket edition
        run: |
          python scripts/build_holon_super.py
          python scripts/test_holon_super.py
          node scripts/test_holon_deals.cjs
          for script in SUPER.HOLON/live.js SUPER.HOLON/assets/*.js; do node --check "$script"; done

      - name: Verify Bat Yam supermarket edition
        run: |
          python scripts/build_batyam_super.py
          python scripts/test_batyam_super.py
          for script in SUPER.BATYAM/live.js SUPER.BATYAM/assets/*.js; do node --check "$script"; done

      - name: Apply and verify Yavne analytics on all generated pages
        run: |
          python scripts/apply_yavne_analytics.py
          python scripts/apply_yavne_analytics.py --check
          node scripts/test-yavne-analytics.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}


