name: Cinema Ashdod unfiltered intake experiment
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/experiment_ashdod_cinema_unfiltered.py"
      - ".github/workflows/cinema-ashdod-unfiltered-experiment.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - name: Read official movie pages without filters or cached trailers
        env:
          ISNET_PUBLISH_FRESH: '1'
        run: python scripts/experiment_ashdod_cinema_unfiltered.py
      - name: Publish only freshly matched official trailers to current movie data
        run: |
          git config user.name "isnet-cinema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/cinema.json
          if ! git diff --cached --quiet; then
            git commit -m "Re-import verified Ashdod cinema trailers from live official pages"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-ashdod-unfiltered-report
          path: cinema-unfiltered-ashdod-report.json
          retention-days: 14
