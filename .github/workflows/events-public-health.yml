name: Public events health checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check-public-event-integrity.cjs', '.github/workflows/events-public-health.yml']
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Publish priceboard']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: public-events-health
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check public city endpoints without generating load
        run: python scripts/check_events_health.py --output /tmp/isnet-health.json
      - name: Verify live event identity and media rules in all five cities
        run: node scripts/check-public-event-integrity.cjs
      - name: Retain health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-events-health-${{ github.run_id }}
          path: /tmp/isnet-health.json
          retention-days: 14
          if-no-files-found: warn
