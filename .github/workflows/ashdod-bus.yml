name: Refresh Ashdod bus schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'
  push:
    branches: [main]
    paths:
      - scripts/collect_ashdod_bus.py
      - scripts/test_ashdod_bus.cjs
      - bus/ashdod/engine.js
      - scripts/collect_ashdod_rail.py
      - scripts/refresh_ashdod_streets.py
      - .github/workflows/ashdod-bus.yml
permissions:
  contents: write
concurrency:
  group: ashdod-bus-schedules
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install requests
      - name: Fetch and extract the official GTFS network
        run: python -u scripts/collect_ashdod_bus.py
      - name: Extract official rail and refresh official street index
        run: |
          python -u scripts/collect_ashdod_rail.py
          python scripts/refresh_ashdod_streets.py
          node scripts/audit_ashdod_streets.cjs
      - name: Check transit planning, calendars and dataset references
        run: |
          node --check bus/ashdod/engine.js
          node --check bus/ashdod/app.js
          node --test scripts/test_ashdod_bus.cjs bus/ashdod/*.test.cjs
      - name: Save only validated transit data
        run: |
          git config user.name 'isnet-transit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bus/ashdod/data/network.json bus/ashdod/data/rail.json bus/ashdod/data/ashdod-streets.json bus/ashdod/data/street-coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Ashdod and intercity bus timetables'
          git pull --rebase origin main
          git push origin HEAD:main
