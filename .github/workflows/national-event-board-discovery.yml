name: Discover national event board candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '50 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/discover_national_event_boards.py'
      - 'scripts/import_national_board_events.py'
      - '.github/workflows/national-event-board-discovery.yml'
permissions:
  contents: write
concurrency:
  group: national-event-board-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect national portal candidates without publication
        run: python scripts/discover_national_event_boards.py
      - name: Import national board events into city datasets
        run: python scripts/import_national_board_events.py
      - name: Save imported events and report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          # Keep the collected source evidence, but always merge it into the
          # newest main rather than rebasing potentially stale whole-feed JSON.
          cp events-preview/admin/data/national-events-discovery.json /tmp/national-events-discovery.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/national-events-discovery.json events-preview/admin/data/national-events-discovery.json
            python scripts/import_national_board_events.py
            git add events-preview/admin/data/national-events-discovery.json events-preview/admin/data/national-board-import-report.json events-preview/ashdod/data/events.json events-preview/rishon-lezion/data/events.json
            if git diff --cached --quiet; then
              echo "No new national-board changes."
              exit 0
            fi
            git commit -m "Update national board event discovery candidates"
            if git push origin HEAD:main; then
              echo "National-board data saved against current main."
              exit 0
            fi
            echo "::warning::Concurrent main update; safely recomputing national-board import on latest data (attempt $attempt)."
            sleep 3
          done
          echo "::error::Could not save national-board changes after four safe attempts; existing city feeds were not overwritten."
          exit 1
# Operator requested run 2026-10-10: national-event-board-discovery.yml
