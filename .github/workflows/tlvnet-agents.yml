name: TLVNET dedicated newsroom agents
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlvnet-agents.yml'
      - 'scripts/tlvnet_agent_worker.py'
permissions:
  contents: read
concurrency:
  group: tlvnet-newsroom-agents
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.CMS_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CMS_SUPABASE_SERVER_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TLVNET_OPENAI_MODEL: ${{ vars.TLVNET_OPENAI_MODEL || 'gpt-4.1-mini' }}
      TLVNET_MAX_JOBS_PER_RUN: '2'
      TLVNET_MAX_PROVIDER_CALLS_PER_RUN: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Process only the TLVNET queue, at most three tasks
        run: python scripts/tlvnet_agent_worker.py
