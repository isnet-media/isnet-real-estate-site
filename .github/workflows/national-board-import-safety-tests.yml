name: Validate national event-board import safety
on:
  pull_request:
    paths:
      - 'scripts/import_national_board_events.py'
      - 'scripts/collect_unified_stage_events.py'
      - 'tests/test_national_board_import_safety.py'
      - '.github/workflows/national-board-import-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import_national_board_events.py'
      - 'scripts/collect_unified_stage_events.py'
      - 'tests/test_national_board_import_safety.py'
      - '.github/workflows/national-board-import-safety-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile scripts/import_national_board_events.py scripts/collect_unified_stage_events.py
      - run: python -m unittest discover -s tests -p 'test_national_board_import_safety.py' -v
