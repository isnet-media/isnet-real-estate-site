name: Normalize event provenance and audit purchase links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/normalize_event_provenance.py"
      - "scripts/test_event_provenance.py"
      - "scripts/audit_purchase_links.py"
      - "scripts/test_purchase_links.py"
      - ".github/workflows/event-provenance-links.yml"
  workflow_run:
    workflows: ["Daily city event intake", "Daily Ashdod local source publication", "Refresh Rishon national events and cinema"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test normalization and link classifications
        run: |
          python scripts/test_event_provenance.py
          python scripts/test_institution_enrichment.py
          python scripts/test_purchase_links.py
      - name: Restore existing source references and institution identity
        run: |
          python scripts/normalize_event_provenance.py
          node scripts/test-institution-ui.cjs
      - name: Audit purchase destinations without changing event links
        run: python -u scripts/audit_purchase_links.py --workers 6 --timeout 7
      - name: Save normalized metadata and audit
        run: |
          git config user.name 'isnet-events-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/ashdod/data/events.json events-preview/rishon-lezion/data/events.json events-preview/admin/data/purchase-link-audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Normalize existing event provenance and audit purchase links'
          git pull --rebase origin main
          git push origin HEAD:main
