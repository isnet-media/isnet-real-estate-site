name: Supermarket publication recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .supermarket-recovery/manifest.json
permissions:
  contents: write
concurrency:
  group: supermarket-publication-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Restore and validate original collection without another scan
        run: |
          for city in $(python -c 'import json; print(" ".join(json.load(open(".supermarket-recovery/manifest.json"))["cities"]))'); do
            python scripts/restore_super_candidate.py --city "$city"
            script_city=$(echo "$city" | tr '[:upper:]' '[:lower:]')
            python "scripts/build_${script_city}_super.py"
            python "scripts/test_${script_city}_super.py" --deployment-only
            python scripts/super_daily_run.py publish --city "$city"
          done
