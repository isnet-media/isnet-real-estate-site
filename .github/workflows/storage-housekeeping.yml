name: Keep verified recovery artifacts and remove redundant copies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/storage-housekeeping.yml
      - scripts/storage-housekeeping.cjs
      - scripts/test-storage-housekeeping.cjs
  schedule:
    - cron: '43 7 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-storage-housekeeping
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/test-storage-housekeeping.cjs
      - name: Remove only redundant successful deployment and old successful scan artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const clean = require('./scripts/storage-housekeeping.cjs');
            await clean({github, context, core});
