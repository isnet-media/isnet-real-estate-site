name: Verify safe Ashdod image-refresh retries
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-ashdod-event-images.yml'
      - '.github/workflows/enrich-events-images.yml'
      - '.github/workflows/ashdod-image-safe-retry-tests.yml'
      - 'tests/test_ashdod_image_safe_retry.py'
      - 'tests/test_ashdod_image_retry_integration.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax for the real retry step
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          step = runpy.run_path('tests/test_ashdod_image_retry_integration.py')['commit_step']()
          Path('/tmp/isnet-image-retry.sh').write_text(step, encoding='utf-8')
          PY
          bash -n /tmp/isnet-image-retry.sh
      - name: Test event ID integrity and concurrent Git writers
        run: python -m unittest discover -s tests -p 'test_ashdod_image*.py' -v
