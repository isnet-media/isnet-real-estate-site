name: Infrastructure stability preflight (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/audit_public_payload.py'
      - 'scripts/safe_http_probe.py'
      - 'scripts/optimize_public_price_json.py'
      - 'scripts/optimize_public_jpegs.py'
      - 'scripts/check_source_backup_freshness.py'
      - '.github/workflows/infrastructure-watchdog.yml'
      - 'tests/test_optimize_public_price_json.py'
      - 'tests/test_audit_public_payload.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/infra-stability-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only payload audit unit tests
        run: python -m unittest discover -s tests -p 'test_audit_public_payload.py'
      - name: Verify JSON pricebook optimizer
        run: python -m unittest discover -s tests -p 'test_optimize_public_price_json.py'
      - name: Compile diagnostic script
        run: python -m py_compile scripts/audit_public_payload.py
  external-http-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure existing public sites at no more than one request per second per host
        run: python scripts/safe_http_probe.py --samples 6 --pause 1.0
  staging-optimization-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Measure savings on a full public staging copy (no deploy)
        run: |
          python scripts/prepare_pages_public.py --output "$RUNNER_TEMP/isnet-preview"
          python scripts/audit_public_payload.py --root "$RUNNER_TEMP/isnet-preview"
          python scripts/optimize_public_price_json.py --root "$RUNNER_TEMP/isnet-preview"
          sudo apt-get update -qq && sudo apt-get install -y -qq libjpeg-turbo-progs
          python scripts/optimize_public_jpegs.py --root "$RUNNER_TEMP/isnet-preview" --limit 2500
          python scripts/audit_public_payload.py --root "$RUNNER_TEMP/isnet-preview"
  backup-artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest source backup is retained (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_source_backup_freshness.py
