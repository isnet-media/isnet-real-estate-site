name: Infrastructure stability preflight (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/audit_public_payload.py'
      - 'tests/test_audit_public_payload.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/infra-stability-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only payload audit unit tests
        run: python -m unittest discover -s tests -p 'test_audit_public_payload.py'
      - name: Compile diagnostic script
        run: python -m py_compile scripts/audit_public_payload.py
