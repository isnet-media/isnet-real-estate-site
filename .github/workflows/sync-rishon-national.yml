name: Refresh Rishon national events and cinema
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_rishon_sources.py'
      - 'scripts/refresh_rishon_cinema.py'
      - '.github/workflows/sync-rishon-national.yml'
permissions:
  contents: write
concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Read national boards and official local descriptions
        run: python -u scripts/sync_rishon_sources.py --collect-only
      - name: Merge on latest city data
        run: |
          cp events-preview/admin/data/rishon-source-snapshot.json /tmp/rishon-source-snapshot.json
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/sync_rishon_sources.py --snapshot /tmp/rishon-source-snapshot.json
      - name: Refresh verified cinema sessions
        run: python -u scripts/refresh_rishon_cinema.py
      - name: Publish only Rishon data and source report
        run: |
          git config user.name isnet-events-bot
          git config user.email actions@users.noreply.github.com
          git add events-preview/rishon-lezion/data/events.json events-preview/rishon-lezion/data/cinema.json events-preview/rishon-lezion/data/cinema-refresh-status.json events-preview/admin/data/rishon-source-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Rishon events and verified cinema schedules'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
