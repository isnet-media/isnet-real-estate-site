name: Refresh Rishon supermarket prices
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rishon-supermarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Collect reviewed physical Rishon branches
        run: |
          python scripts/refresh_rishon_super_prices.py --raw-dir "$RUNNER_TEMP/rishon-official"
          python scripts/build_rishon_super.py
          python scripts/test_rishon_super.py
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rishon-supermarket-${{ github.run_id }}
          path: SUPER.RISHON/data/refresh-status.json
          retention-days: 30
      - name: Publish only validated Rishon data
        run: |
          git config user.name 'ISNET supermarket updater'
          git config user.email 'actions@users.noreply.github.com'
          git add SUPER.RISHON/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Rishon supermarket prices'
          git pull --rebase origin main
          git push origin HEAD:main
