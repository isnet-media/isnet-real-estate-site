name: Refresh Holon supermarket prices
on:
  schedule:
    # 06:00 Israel in summer/winter; later wake-ups recover scheduler delays.
    # The durable daily claim prevents any additional collection that day.
    - cron: '0 3,4 * * *'
    - cron: '17 5,8,11,14,17,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/super-holon-prices.yml
      - scripts/super_daily_run.py
permissions:
  contents: write
concurrency:
  group: holon-supermarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claim one daily collection after 06:00 Israel
        id: daily
        run: python scripts/super_daily_run.py claim --city HOLON
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
        if: steps.daily.outputs.collect == 'true'
      - name: Collect reviewed physical Holon branches
        if: steps.daily.outputs.collect == 'true'
        run: |
          python scripts/refresh_holon_super_prices.py --raw-dir "$RUNNER_TEMP/holon-official"
          python scripts/build_holon_super.py
          python scripts/test_holon_super.py --deployment-only
      - name: Preserve collection evidence
        if: always() && steps.daily.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holon-supermarket-${{ github.run_id }}
          path: SUPER.HOLON/data/refresh-status.json
          retention-days: 30
      - name: Publish only validated Holon data
        if: steps.daily.outputs.collect == 'true'
        run: |
          python scripts/super_daily_run.py publish --city HOLON
      - name: Record failed attempt without publishing unvalidated data
        if: failure() && steps.daily.outputs.collect == 'true'
        run: python scripts/super_daily_run.py failed --city HOLON
