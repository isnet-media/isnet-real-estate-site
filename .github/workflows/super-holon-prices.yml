name: Refresh Holon supermarket prices
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holon-supermarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Collect reviewed physical Holon branches
        run: |
          python scripts/refresh_holon_super_prices.py --raw-dir "$RUNNER_TEMP/holon-official"
          python scripts/build_holon_super.py
          python scripts/test_holon_super.py
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holon-supermarket-${{ github.run_id }}
          path: SUPER.HOLON/data/refresh-status.json
          retention-days: 30
      - name: Publish only validated Holon data
        run: |
          git config user.name 'ISNET supermarket updater'
          git config user.email 'actions@users.noreply.github.com'
          # The validated city builder also regenerates HTML and product groups.
          git add SUPER.HOLON/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Holon supermarket prices'
          git pull --rebase origin main
          git push origin HEAD:main
