name: Verify Mevalim Ashdod occurrence-safe merge
on:
  pull_request:
    paths:
      - 'scripts/sync_mevalim_ashdod_direct.py'
      - 'tests/test_mevalim_safe_merge.py'
      - '.github/workflows/mevalim-occurrence-safety-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Ensure Mevalim merger preserves distinct showtimes and venues
        run: python -m unittest discover -s tests -p test_mevalim_safe_merge.py -v
