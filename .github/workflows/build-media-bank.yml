name: Build central media bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_media_bank.py"
      - "scripts/optimize_media_bank_images.py"
      - "scripts/reuse_media_bank_images.py"
      - "events-preview/ashdod/data/events.json"
      - "events-preview/rishon-lezion/data/events.json"
      - ".github/workflows/build-media-bank.yml"
  workflow_run:
    workflows:
      - "Enrich Ashdod event images"
      - "Verify and cache Rishon event photos"
      - "Enrich event content with AI"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: isnet-media-bank
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Build media bank
        run: python -u scripts/build_media_bank.py

      - name: Create lightweight card images
        run: python -u scripts/optimize_media_bank_images.py

      - name: Apply lightweight thumbnails to event cards
        run: python -u scripts/apply_media_bank_thumbnails.py

      - name: Commit media bank index
        run: |
          git config user.name "isnet-media-bot"
          git config user.email "actions@users.noreply.github.com"
          # Other event collectors update the same large city feeds. Rebuild
          # against the newest main on every race; never force-push stale JSON.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::warning::Main advanced; safely rebuilding media against the latest city feeds (attempt $attempt)."
              git reset --hard origin/main
              python -u scripts/build_media_bank.py
              python -u scripts/optimize_media_bank_images.py
              python -u scripts/apply_media_bank_thumbnails.py
            fi
            git add events-preview/media-bank/data/media.json events-preview/media-bank/data/artists.json events-preview/media-bank/data/productions.json events-preview/media-bank/data/quality.json events-preview/media-bank/cards events-preview/ashdod/data/events.json events-preview/rishon-lezion/data/events.json
            if git diff --cached --quiet; then
              echo "Media bank is already current."
              exit 0
            fi
            git commit -m "Refresh central media bank"
            if git push origin HEAD:main; then
              echo "Media bank published against the latest main."
              exit 0
            fi
            echo "::warning::Concurrent GitHub update; preparing a safe retry ($attempt/5)."
            sleep 3
          done
          echo "::error::Media bank publication did not succeed after five safe attempts; existing public feeds were not overwritten."
          exit 1
