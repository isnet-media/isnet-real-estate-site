name: FRIENDS candidate-only extraction tests
on:
  pull_request:
    paths:
      - "scripts/discover_friends_events.py"
      - "tests/test_friends_source_occurrences.py"
      - ".github/workflows/friends-candidates-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_friends_source_occurrences.py' -v
