name: Validate event image coverage reporting

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fast_fill_event_images_from_listings.py"
      - "tests/test_event_image_coverage.py"
      - ".github/workflows/event-image-coverage-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fast_fill_event_images_from_listings.py"
      - "tests/test_event_image_coverage.py"
      - ".github/workflows/event-image-coverage-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fallback and event-specific image metrics
        run: python -m unittest discover -s tests -p test_event_image_coverage.py -v
