name: Refresh Herzliya events and culinary guide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/test_collector_scopes.py
      - scripts/sync_herzliya_events.py
      - scripts/herzliya_event_quality.py
      - scripts/collect_herzliya_seniors.py
      - scripts/test_herzliya_events.py
      - scripts/build_herzliya_events.py
      - .github/workflows/herzliya-events.yml
  schedule:
    - cron: '45 3 * * 0'
    - cron: '45 5 * * 4'
    - cron: '45 6 13 * *'
    - cron: '45 7 13 1,4,7,10 *'
permissions:
  contents: write
concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 3 * * 0'
        run: python -u scripts/sync_herzliya_events.py --scope events
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 6 13 * *'
        run: python -u scripts/sync_herzliya_events.py --scope directories
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 4'
        run: python -u scripts/enrich_herzliya_cinema.py
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 4'
        run: python -u scripts/refresh_herzliya_city_cinema.py
        continue-on-error: true
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 3 * * 0'
        run: python -u scripts/collect_herzliya_seniors.py --scope events
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 7 13 1,4,7,10 *'
        run: python -u scripts/collect_herzliya_seniors.py --scope catalog
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 6 13 * *'
        run: python -u scripts/enrich_herzliya_food.py
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 6 13 * *'
        run: python scripts/enrich_herzliya_places.py
      - if: github.event_name != 'push'
        run: python scripts/polish_herzliya_catalog.py
      - if: github.event_name != 'push'
        run: python scripts/build_herzliya_events.py
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 5 * * 4'
        run: python scripts/cache_herzliya_cinema_posters.py
      - if: github.event_name != 'push'
        run: python scripts/build_herzliya_events.py
      - run: python scripts/test_herzliya_events.py
      - run: python scripts/test_collector_scopes.py
      - run: node scripts/test-herzliya-cinema-speed.cjs herzliya
      - name: Save verified local data and pages
        if: github.event_name != 'push'
        run: |
          git config user.name 'isnet-events-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/herzliya
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Herzliya events, films and culinary sources'
          git pull --rebase origin main
          git push origin HEAD:main
