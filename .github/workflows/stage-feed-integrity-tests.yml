name: Validate stage event identity safety
on:
  pull_request:
    paths:
      - 'scripts/swap_our_stage_events_with_boards.py'
      - 'scripts/verify_public_event_readback.py'
      - 'tests/test_stage_feed_integrity.py'
      - '.github/workflows/stage-feed-integrity-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/swap_our_stage_events_with_boards.py'
      - 'scripts/verify_public_event_readback.py'
      - 'tests/test_stage_feed_integrity.py'
      - '.github/workflows/stage-feed-integrity-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile safety scripts
        run: python -m py_compile scripts/swap_our_stage_events_with_boards.py scripts/verify_public_event_readback.py
      - name: Check venue and ID safety
        run: python -m unittest discover -s tests -p 'test_stage_feed_integrity.py' -v
