name: All cities supermarket public health
on:
  schedule:
    # One daily verification after the morning collection (UTC).
    - cron: '30 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish priceboard"]
    types: [completed]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python scripts/check_super_public.py
