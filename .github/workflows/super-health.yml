name: All cities supermarket public health
on:
  schedule:
    # Morning/evening full checks (UTC). Hourly owner monitors data changes.
    - cron: '30 6,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/check_super_public.py', 'scripts/test_super_public_freshness.py', '.github/workflows/super-health.yml']
permissions:
  contents: read
concurrency:
  group: supermarket-public-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python scripts/test_super_public_freshness.py
      - run: python scripts/check_super_public.py
