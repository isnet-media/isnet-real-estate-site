name: Refresh Yavne supermarket prices
on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_yavne_super_prices.py
      - scripts/super-yavne/**
      - .github/workflows/super-yavne-prices.yml
permissions:
  contents: write
concurrency:
  group: yavne-supermarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Collect reviewed Yavne branches and validate city isolation
        run: |
          python scripts/refresh_yavne_super_prices.py --raw-dir "$RUNNER_TEMP/yavne-official"
          python scripts/build_yavne_super.py
          python scripts/test_yavne_super.py
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yavne-supermarket-${{ github.run_id }}
          path: SUPER.YAVNE/data/refresh-status.json
          retention-days: 30
      - name: Publish validated Yavne data
        run: |
          git config user.name 'ISNET supermarket updater'
          git config user.email 'actions@users.noreply.github.com'
          # The validated city builder also regenerates HTML and product groups.
          git add SUPER.YAVNE/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Yavne supermarket prices'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report retained sources
        run: |
          python - <<'PY'
          import json
          r=json.load(open('SUPER.YAVNE/data/refresh-status.json'))
          if not r['all_sources_updated']: print('::warning::Yavne collection is partial; previous source dates are retained')
          PY
