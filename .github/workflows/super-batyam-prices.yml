name: Refresh Bat Yam supermarket prices
on:
  schedule:
    # Once Sunday-Friday, after shops open (07:30-07:54 winter, 08:30-08:54 summer Israel time).
    # GitHub cron uses UTC; Saturday is excluded and claim guard also forbids Saturday.
    - cron: '50 5 * * 0-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: batyam-supermarket-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claim one daily collection after 06:00 Israel
        id: daily
        run: python scripts/super_daily_run.py claim --city BATYAM
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
        if: steps.daily.outputs.collect == 'true'
      - name: Collect reviewed physical Bat Yam branches
        if: steps.daily.outputs.collect == 'true'
        run: |
          python scripts/refresh_batyam_super_prices.py --raw-dir "$RUNNER_TEMP/batyam-official"
          python scripts/build_batyam_super.py
          python scripts/test_batyam_super.py --deployment-only
      - name: Pack collection evidence with portable archive paths
        if: always() && steps.daily.outputs.collect == 'true'
        run: tar -czf "$RUNNER_TEMP/super-batyam-evidence.tar.gz" SUPER.BATYAM/
      - name: Preserve collection evidence
        if: always() && steps.daily.outputs.collect == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batyam-supermarket-${{ github.run_id }}
          path: ${{ runner.temp }}/super-batyam-evidence.tar.gz
          retention-days: 30
      - name: Publish only validated Bat Yam data
        if: steps.daily.outputs.collect == 'true'
        run: |
          python scripts/super_daily_run.py publish --city BATYAM
      - name: Record failed attempt without publishing unvalidated data
        if: failure() && steps.daily.outputs.collect == 'true'
        run: python scripts/super_daily_run.py failed --city BATYAM
