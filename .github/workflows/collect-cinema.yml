name: Collect cinema listings for editorial review
on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    paths:
      - "scripts/collect_cinema_candidates.py"
      - ".github/workflows/collect-cinema.yml"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current cinema source listings
        run: python scripts/collect_cinema_candidates.py
      - name: Archive candidates for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-review-candidates
          path: cinema-review-candidates.json
          retention-days: 7
