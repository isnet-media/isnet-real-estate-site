name: Refresh verified Ashdod cinema

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/refresh_ashdod_cinema.py"
      - "scripts/test_ashdod_cinema_refresh.py"
      - ".github/workflows/collect-cinema.yml"

permissions:
  contents: write

concurrency:
  group: ashdod-cinema-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official-source parsers
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Check city isolation and failure preservation
        run: python scripts/test_ashdod_cinema_refresh.py
      - name: Collect complete official Ashdod snapshots
        id: intake
        continue-on-error: true
        run: python scripts/refresh_ashdod_cinema.py
      - name: Publish verified data and source-health report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events-preview/ashdod/data/cinema.json events-preview/ashdod/data/cinema-refresh-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Ashdod cinema listings and source health'
          # Integrate unrelated UI commits; conflicting cinema edits must fail safely.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Summarize source health and missing data
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('events-preview/ashdod/data/cinema-refresh-status.json')
          if not p.exists(): raise SystemExit(1)
          r=json.loads(p.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### Ashdod cinema refresh\n\n')
              for venue, source in r['sources'].items():
                  out.write(f"- {venue}: {source['status']}; {source.get('sessions',0)} verified sessions\n")
                  if source['status'] != 'ok': print(f"::warning::{venue}: {source.get('error','source failed')}; existing data preserved")
              out.write('\nCounts: '+json.dumps(r.get('counts',{}),ensure_ascii=False)+'\n')
              out.write('\nMissing details: '+str(len(r.get('missing',[])))+' films. Official poster URLs are checked before remote display.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashdod-cinema-source-health
          path: events-preview/ashdod/data/cinema-refresh-status.json
          retention-days: 14
      - name: Mark a total source outage as failed
        if: steps.intake.outcome == 'failure'
        run: exit 1
