name: Refresh Ashdod supermarket prices
on:
  schedule:
    # UTC candidates; the gate permits collection only at 06:00 Israel time.
    - cron: '0 3,4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: super-price-refresh
  cancel-in-progress: false
jobs:
  local-time:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.gate.outputs.collect }}
    steps:
      - name: Permit one daily collection at 06:00 Israel time
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          local_day=$(TZ=Asia/Jerusalem date +%Y%m%d)
          local_hour=$(TZ=Asia/Jerusalem date +%H)
          if [ "$local_day" -ge 20261025 ] && { [ "$EVENT_NAME" != schedule ] || [ "$local_hour" = 06 ]; }; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi
  refresh:
    needs: local-time
    if: needs.local-time.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Check rollback protection and branch identity
        run: python scripts/test_super_refresh.py
      - name: Collect official branch files
        run: |
          python scripts/import_super_shufersal.py
          python scripts/refresh_super_prices.py --raw-dir "$RUNNER_TEMP/super-official"
      - name: Validate publication candidate
        run: |
          python scripts/build_super_city_basket.py
          python scripts/test_super_city_basket.py
          python scripts/build_super_smart_shopping.py
          node scripts/test_super_smart_shopping.cjs
          python scripts/test_super_deals.py
          node scripts/test_super_deals.cjs
          python scripts/test_super_homepage.py
          python scripts/audit_super_site.py
      - name: Preserve evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supermarket-refresh-${{ github.run_id }}
          path: |
            SUPER.ASHDOD/data/refresh-status.json
            SUPER.ASHDOD/data/site-health.json
          retention-days: 30
      - name: Commit validated data without overwriting concurrent edits
        run: |
          git config user.name 'ISNET supermarket updater'
          git config user.email 'actions@users.noreply.github.com'
          git add SUPER.ASHDOD/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official Ashdod supermarket prices and health report'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Flag partial collection for monitoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('SUPER.ASHDOD/data/refresh-status.json').read_text())
          if not r['all_sources_updated']: print('::warning::Some sources retained previous prices; inspect refresh artifact')
          PY
