name: Test Rishon source event-ID safety
on:
  pull_request:
    paths:
      - 'scripts/sync_rishon_sources.py'
      - 'scripts/test_rishon_source_identity.py'
      - '.github/workflows/rishon-source-id-safety-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_rishon_sources.py'
      - 'scripts/test_rishon_source_identity.py'
      - '.github/workflows/rishon-source-id-safety-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check source-ID collision safety
        run: |
          python -m py_compile scripts/sync_rishon_sources.py
          python scripts/test_rishon_source_identity.py
