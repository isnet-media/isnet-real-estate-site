name: Supermarket private storage canary (no live cutover)
on:
  push:
    branches: [infra/supermarket-isolation-20261110]
    paths:
      - "scripts/super_storage_canary.py"
      - ".github/workflows/super-storage-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isnet-super-private-storage-canary
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.CMS_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CMS_SUPABASE_SERVER_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload two verified public-source JSON canaries to private storage and read back
        run: python scripts/super_storage_canary.py
