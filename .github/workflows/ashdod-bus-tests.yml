name: Ashdod direct-first bus release checks
on:
  push:
    paths:
      - 'bus/ashdod/**'
      - '.github/workflows/ashdod-bus-tests.yml'
  pull_request:
    paths:
      - 'bus/ashdod/**'
      - '.github/workflows/ashdod-bus-tests.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published JavaScript syntax
        run: |
          node --check bus/ashdod/engine.js
          node --check bus/ashdod/door-to-door.js
          node --check bus/ashdod/approximate.js
          node --check bus/ashdod/app.js
      - name: Real GTFS and direct-first regression tests
        run: node --test bus/ashdod/*.test.cjs

  browser-smoke:
    needs: node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: npm install --no-save playwright@1.55.0 leaflet@1.9.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test direct bus and map on mobile and desktop
        run: node bus/ashdod/browser-smoke.cjs
      - name: Save QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashdod-bus-release-screenshots
          path: bus/ashdod/screenshots/*.png
          if-no-files-found: ignore
