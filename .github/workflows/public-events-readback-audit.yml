name: Verify public event feed read-back
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
  workflow_run:
    workflows:
      - 'Publish priceboard'
      - 'Unified Ashdod and Rishon stage event collection'
      - 'Refresh Rishon national events and cinema'
      - 'Daily Ashdod supplemental source publication'
    types: [completed]
  push:
    branches: [main, audit/public-stage-feed-readback-20261023]
    paths:
      - 'scripts/verify_public_event_readback.py'
      - '.github/workflows/public-events-readback-audit.yml'
permissions:
  contents: read
concurrency:
  group: isnet-events-public-feed-readback
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current production data from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          fetch-depth: 1
      - name: Checkout read-only verification code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-code
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize expected feeds with the publication integrity policy
        run: |
          python current-main/scripts/repair_stage_source_metadata.py --apply
          node current-main/scripts/audit-event-integrity.cjs --apply
      - name: Show unresolved identity candidates without changing them
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('current-main/events-preview/admin/data/event-integrity-report.json')
          if p.exists():
              d = json.loads(p.read_text())
              for city in ('ashdod', 'rishon-lezion'):
                  for pair in d.get('cities', {}).get(city, {}).get('suspected_duplicates_for_review', [])[:5]:
                      print(json.dumps({'city': city, 'unresolved_pair': pair}, ensure_ascii=False))
          PY
      - name: Compare public JSON with normalized current GitHub feed
        if: ${{ always() }}
        run: python audit-code/scripts/verify_public_event_readback.py --repo-root current-main --output /tmp/isnet-public-event-readback.json
      - name: Retain read-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-event-readback-${{ github.run_id }}
          path: |
            /tmp/isnet-public-event-readback.json
            current-main/events-preview/admin/data/event-integrity-report.json
          retention-days: 14
          if-no-files-found: warn
