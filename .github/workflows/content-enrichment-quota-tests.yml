name: Validate event AI quota safety
on:
  pull_request:
    paths:
      - "scripts/enrich_event_content_ai.py"
      - "tests/test_event_content_quota.py"
      - ".github/workflows/content-enrichment-quota-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/enrich_event_content_ai.py"
      - "tests/test_event_content_quota.py"
      - ".github/workflows/content-enrichment-quota-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile scripts/enrich_event_content_ai.py
      - run: python -m unittest discover -s tests -p 'test_event_content_quota.py' -v
