name: Refresh Yavne events
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 0'
permissions:
  contents: write
concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/test_yavne_events.py
      - run: python -u scripts/sync_yavne_events.py
      - run: python -u scripts/audit_yavne_event_media.py
      - run: python -u scripts/cache_yavne_images.py
      - run: |
          python scripts/sync_event_city_views.py
          python scripts/build_event_public_assets.py
          git restore -- events-preview/ashdod events-preview/rishon-lezion
          rm -f events-preview/admin/data/site-build-report.json
          git config user.name 'isnet-events-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/yavne events-preview/admin/data/yavne-source-report.json events-preview/admin/data/yavne-non-event-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Yavne events and city frontend'
          # Only Yavne outputs above are staged; discard other cities' generated
          # worktree files so they cannot block the rebase or leak into this commit.
          git restore --worktree -- .
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Yavne refresh could not be published after three attempts." >&2
          exit 1
