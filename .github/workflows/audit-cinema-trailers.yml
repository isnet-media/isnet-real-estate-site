name: Audit Ashdod cinema trailer coverage
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
  push:
    paths:
      - "events-preview/ashdod/data/cinema.json"
      - "scripts/audit_cinema_trailers.py"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active film trailer coverage
        run: python scripts/audit_cinema_trailers.py
      - name: Retain diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-trailer-coverage
          path: cinema-trailer-coverage.json
          retention-days: 14
