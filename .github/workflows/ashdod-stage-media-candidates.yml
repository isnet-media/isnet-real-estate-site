name: Fetch Ashdod stage content and media candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *'
  push:
    paths:
      - 'scripts/fetch_ashdod_stage_media_candidates.py'
      - '.github/workflows/ashdod-stage-media-candidates.yml'
permissions:
  contents: write
concurrency:
  group: ashdod-stage-media-candidates
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Fetch matched stage-show source pages and capture candidates
        run: python scripts/fetch_ashdod_stage_media_candidates.py
      - name: Save review report without publishing
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/stage-content-media-review-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Ashdod stage content image and video source candidates"
            # Several event pipelines write main concurrently. Retain the report and
            # retry only a non-forced, rebased fast-forward push on branch movement.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Report changed upstream; cannot safely rebase, leaving report unpublished."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not publish the review report after 5 safe attempts."
              exit 1
            fi
          fi
