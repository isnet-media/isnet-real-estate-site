name: Build Yavne culinary directory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_yavne_food.py
      - scripts/build_yavne_food.py
      - events-preview/yavne/data/food-source-seeds.json
      - .github/workflows/yavne-food.yml
permissions:
  contents: write
concurrency:
  group: yavne-food-directory
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python -u scripts/collect_yavne_food.py
      - run: python scripts/build_yavne_food.py
      - run: node --check events-preview/yavne/restaurants.js
      - run: |
          git config user.name 'isnet-events-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/yavne/restaurants.html events-preview/yavne/restaurants.js events-preview/yavne/restaurants.css events-preview/yavne/data/restaurants.json events-preview/yavne/assets/restaurants events-preview/admin/data/yavne-food-source-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Populate Yavne culinary directory from verified local business pages'
          git pull --rebase origin main
          git push origin HEAD:main
