name: Stage full TLV supermarket in private storage (no public cutover)
on:
  push:
    branches: [infra/supermarket-isolation-20261110]
    paths:
      - "scripts/stage_super_private_storage.py"
      - ".github/workflows/super-full-private-stage.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isnet-super-tlv-full-private-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.CMS_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CMS_SUPABASE_SERVER_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage TLV unchanged and check each private storage object
        run: python scripts/stage_super_private_storage.py --city TLV
