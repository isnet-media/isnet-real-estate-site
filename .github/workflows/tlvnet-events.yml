name: Refresh TLVNET public events
on:
  schedule:
    - cron: '17 5,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_tlvnet_events.py
      - .github/workflows/tlvnet-events.yml
permissions:
  contents: write
concurrency:
  group: tlvnet-public-events
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.2 requests==2.32.5 Pillow==11.3.0
      - run: python scripts/collect_tlvnet_events.py
      - name: Publish only the TLVNET factual feed
        run: |
          git config user.name 'TLVNET event intake'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/tel-aviv/data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh TLVNET verified future event facts'
          git pull --rebase origin main
          git push origin HEAD:main
