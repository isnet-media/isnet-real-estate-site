name: Refresh TLVNET public events
on:
  schedule:
    - cron: '17 5 * * 0'
    - cron: '17 5 * * 4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_tlvnet_events.py
      - scripts/test_tlvnet_culture.py
      - events-preview/tel-aviv/data/culture-sources.json
      - scripts/collect_tlvnet_cinema.py
      - scripts/collect_tlvnet_children.py
      - scripts/collect_tlvnet_additional_cinema.py
      - scripts/tlvnet_publicity.py
      - .github/workflows/tlvnet-events.yml
permissions:
  contents: write
concurrency:
  group: tlvnet-public-events
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.2 requests==2.32.5 Pillow==11.3.0
      - run: python scripts/test_tlvnet_culture.py
      - if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 0'
        run: python scripts/collect_tlvnet_events.py
      - name: Refresh verified children events
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 0'
        continue-on-error: true
        run: python scripts/collect_tlvnet_children.py
      - name: Refresh Jaffa and Rav Hen cinema
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 4'
        continue-on-error: true
        run: python scripts/collect_tlvnet_additional_cinema.py
      - name: Refresh Lev and Tel Aviv Cinematheque
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 4'
        continue-on-error: true
        run: python scripts/collect_tlvnet_cinema.py
      - name: Publish only the TLVNET factual feeds and publicity assets
        run: |
          git config user.name 'TLVNET event intake'
          git config user.email 'actions@users.noreply.github.com'
          git add events-preview/tel-aviv/data/events.json events-preview/tel-aviv/data/culture-coverage.json events-preview/tel-aviv/data/cinema-local.json events-preview/tel-aviv/data/children.json events-preview/tel-aviv/data/cinema-additional.json
          if [ -d events-preview/tel-aviv/assets/publicity ]; then git add events-preview/tel-aviv/assets/publicity; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh TLVNET verified future events, cinema and producer images'
          git pull --rebase origin main
          git push origin HEAD:main

