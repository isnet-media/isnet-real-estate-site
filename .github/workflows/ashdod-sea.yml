name: Refresh Ashdod sea forecast
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/refresh-ashdod-sea.mjs
      - scripts/refresh-ashdod-sea.test.mjs
      - .github/workflows/ashdod-sea.yml
permissions:
  contents: write
concurrency:
  group: ashdod-sea-forecast
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/refresh-ashdod-sea.test.mjs
      - run: node scripts/refresh-ashdod-sea.mjs
      - name: Save validated public forecast
        run: |
          git config user.name 'isnet-weather-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add weather/ashdod/sea.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Ashdod Southern Coast sea forecast'
          git pull --rebase origin main
          git push origin HEAD:main
