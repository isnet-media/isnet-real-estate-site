name: Stage one coherent KGAT main-site release privately (SHA256 pilot; no cutover)
on:
  push:
    branches: [infra/supermarket-isolation-20261110]
    paths:
      - '.github/workflows/super-current-kgat-private-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isnet-super-single-current-kgat-private-pilot
  cancel-in-progress: false
jobs:
  stage-private-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PINNED_MAIN_SHA: a71740f51803673d96367a8fa88c011e43e691f8
      SUPABASE_URL: ${{ secrets.CMS_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CMS_SUPABASE_SERVER_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout PR-only read-only review and private-stage tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact previously reviewed committed main revision
        uses: actions/checkout@v4
        with:
          ref: a71740f51803673d96367a8fa88c011e43e691f8
          path: current-source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout latest main separately for immutable city-tree comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: latest-main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed if main city tree advanced or pinned source changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C current-source rev-parse HEAD)" = "$PINNED_MAIN_SHA"
          OLD_TREE="$(git -C current-source rev-parse HEAD:SUPER.KGAT)"
          NEW_TREE="$(git -C latest-main rev-parse HEAD:SUPER.KGAT)"
          test "$OLD_TREE" = "$NEW_TREE" || { echo "::error::KGAT advanced since the approved immutable candidate; do not upload stale full-site files"; exit 1; }
          echo "Verified pinned main city tree: $OLD_TREE"
      - name: Validate original price-source provenance and build exact complete candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_super_full_source_candidate.py' -v
          python -m scripts.verify_super_full_source_candidate \
            --source current-source --source-sha "$PINNED_MAIN_SHA" \
            --city KGAT --output "$RUNNER_TEMP/kgat-current-private-candidate"
          python - <<'PY'
          import hashlib,json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"kgat-current-private-candidate"
          review=json.loads((base/"PRIVATE-REVIEW-ONLY.json").read_bytes())
          manifest=json.loads((base/"release-manifest.json").read_bytes())
          assert review["city"]=="KGAT" and review["committed_main_sha"]==os.environ["PINNED_MAIN_SHA"]
          assert review["approved_for_public"] is False and review["collector_invoked"] is False
          assert review["public_cutover"] is False and review["all_sources_updated"] is False
          assert manifest["city"]=="KGAT" and len(manifest["files"])>=100
          for obj in manifest["files"]:
              raw=(base/obj["path"]).read_bytes()
              assert len(raw)==obj["bytes"] and hashlib.sha256(raw).hexdigest()==obj["sha256"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as log:
              log.write(f"KGAT source pinned at {review['committed_main_sha']}; {review['updated_count']}/{review['branch_count']} branches updated; {review['retained_previous_count']} retained older prices. Public approval remains FALSE.\\n\\n")
          PY
      - name: Stage only KGAT original main files under NEW immutable private release and SHA256 read back every file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          from scripts import stage_super_private_storage as private
          private.ROOT=pathlib.Path("current-source").resolve()
          private.publish("KGAT", os.environ["PINNED_MAIN_SHA"])
          PY
      - name: Independently verify real full-path private objects, source SHA256, local Git restoration and anonymous denial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib
          from scripts import verify_super_private_restoration as proof
          proof.ROOT=pathlib.Path("current-source").resolve()
          proof.RELEASES["KGAT"]=os.environ["PINNED_MAIN_SHA"]
          proof.audit("KGAT")
          PY
      - name: Retain exact source and restoration proof (private CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: isnet-kgat-current-main-private-restore-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/super-verify-KGAT.json
          retention-days: 7
          if-no-files-found: error
