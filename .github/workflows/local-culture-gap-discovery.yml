name: Discover supplementary local cultural events
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
  push:
    paths:
      - 'scripts/discover_local_culture_gaps.py'
      - '.github/workflows/local-culture-gap-discovery.yml'
permissions:
  contents: write
concurrency:
  group: local-culture-gap-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/discover_local_culture_gaps.py
      - name: Save local candidate report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          # The scraper output is read-only candidate evidence; never modify CMS feeds.
          # Keep a snapshot while synchronizing with unrelated main-branch writers.
          report=events-preview/admin/data/local-culture-gaps-ashdod-rishon.json
          cp "$report" "${RUNNER_TEMP}/local-culture-candidates.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/local-culture-candidates.json" "$report"
            git add "$report"
            if git diff --cached --quiet; then
              echo "Local candidate report already matches main."
              exit 0
            fi
            git commit -m "Update local culture candidate discovery for active cities"
            if git push origin HEAD:main; then
              echo "Local candidate report committed successfully."
              exit 0
            fi
            echo "::warning::Concurrent main update; retrying local candidate report (attempt $attempt)."
            sleep "$attempt"
          done
          echo "::error::Local candidate report was not saved after five safe retries."
          exit 1
