<style>
*{box-sizing:border-box}body{margin:0;background:#101821;color:#f7f8fa;font-family:Heebo,Arial,sans-serif;line-height:1.65}a{color:inherit}.shell{max-width:1080px;margin:auto;padding:0 20px}header{background:#16222f;border-bottom:1px solid #384551;padding:18px 0}header .shell{display:flex;gap:24px;align-items:center;justify-content:space-between}header strong{font-size:20px}header a,.back{color:#d4e9fa;text-decoration:none}main{padding:22px 0 80px}.back{display:inline-block;margin:8px 0 22px}.hero{overflow:hidden;border:1px solid #344354;border-radius:20px;background:#1a2836}.hero img{display:block;width:100%;height:clamp(220px,37vw,430px);object-fit:cover}.hero .body{padding:25px 30px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tags span{background:#27394b;color:#e2edf7;padding:5px 12px;border-radius:30px;font-size:13px}h1{font-size:clamp(26px,4vw,42px);line-height:1.2;margin:15px 0 5px}h2{font-size:23px;margin:0 0 16px}.lead{font-size:18px;color:#d6e0e9;margin:10px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;margin-top:22px}.panel{background:#1b2937;border:1px solid #334658;border-radius:17px;padding:23px;margin-bottom:18px}.panel p{white-space:pre-line;color:#dce6ee}.panel li{margin:0 0 12px}.btn{display:block;text-align:center;padding:14px 16px;border-radius:10px;background:#f5bd55;color:#14202b;font-weight:800;text-decoration:none;margin:10px 0}.btn.secondary{background:#30465b;color:#f8fcff}.muted{color:#afbfcd;font-size:14px}.missing{height:175px;background:linear-gradient(130deg,#293f52,#1d2b38);display:grid;place-items:center;color:#d7e7f3}.credit{font-size:12px;color:#b9cbd9;margin-top:3px}.notice{background:#293b4a;padding:12px;border-radius:10px;color:#e8f0fa}.foot{font-size:12px;color:#adbdc9;margin-top:20px}@media(max-width:720px){.layout{grid-template-columns:1fr}.hero .body{padding:20px}.panel{padding:18px}header strong{font-size:16px}}
</style><script src="ashdod-analytics.js?v=20261015-ga-complete1"></script><script defer src="isnet-advertise.js?v=20261019-contact1"></script><script src="site-seo.js?v=20261019-seo1"></script></head><body><header><div class="shell"><strong>מה עושים באשדוד · מבית אשדוד נט</strong><a href="category.html?category=kids">ילדים ומשפחה ←</a></div></header><main class="shell"><a class="back" href="attractions.html">→ חזרה לכל האטרקציות</a><div id="content"><p>טוענים את פרטי האטרקציה…</p></div></main><script>
(function(){
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{const u=new URL(s,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const id=new URLSearchParams(location.search).get('id')||'';
function render(p){const name=esc(p.name),photo=safe(p.image),tel=String(p.phone||'').replace(/[^+0-9]/g,''),booking=safe(p.booking_url||''),map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.map_query||p.name+' אשדוד');
document.title=p.name+' | אטרקציות לילדים באשדוד';
const badges=(p.badges||[]).map(t=>'<span>'+esc(t)+'</span>').join('');
const points=(p.highlights||[]).map(t=>'<li>'+esc(t)+'</li>').join('');
const website=safe(p.operator_website_url||'');const actions=(tel?'<a class="btn" href="tel:'+esc(tel)+'">☎ להתקשרות '+esc(p.phone)+'</a>':'')+(booking?'<a class="btn" target="_blank" rel="noopener" href="'+esc(booking)+'">להזמנה ישירה ↗</a>':'')+(website?'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(website)+'">לאתר הרשמי של המקום ↗</a>':'')+'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(map)+'">ניווט למקום ↗</a>';
document.getElementById('content').innerHTML='<article class="hero">'+(photo?'<img src="'+esc(photo)+'" alt="'+name+'" onerror="this.style.display=\'none\'">':'<div class="missing">צילום המקום יעלה לאחר אימות</div>')+'<div class="body"><div class="tags">'+badges+'</div><h1>'+name+'</h1><div class="lead">'+esc(p.tagline||'')+'</div>'+(p.image_credit?'<div class="credit">'+esc(p.image_credit)+'</div>':'')+'</div></article><div class="layout"><div><section class="panel"><h2>מה מחכה לכם?</h2><p>'+esc(p.description||'')+'</p></section>'+(points?'<section class="panel"><h2>למה כדאי להגיע?</h2><ul>'+points+'</ul></section>':'')+(p.notice?'<section class="panel"><h2>כדאי לדעת לפני שמגיעים</h2><div class="notice">'+esc(p.notice)+'</div></section>':'')+'</div><aside><section class="panel"><h2>מתכננים ביקור?</h2><p class="muted">לשאלות, תיאום או הזמנה השתמשו בפרטי המפעיל כאשר אומתו.</p>'+actions+(p.last_verified_at||p.verified_at?'<p class="foot">בדיקת מידע: '+esc(p.last_verified_at||p.verified_at)+'</p>':'')+'</section></aside></div>';}
const guideId=new URLSearchParams(location.search).get('guide');Promise.all([fetch('data/places.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/attractions-guide.json',{cache:'no-store'}).then(r=>r.json())]).then(([d,g])=>{const existing=[...(d.categories?.['kids-attractions']?.items||[]),...(d.categories?.attractions?.items||[])];const p=guideId?(g.verified_sources||[]).find(x=>x.id===guideId):existing.find(x=>x.id===id);if(!p){document.getElementById('content').textContent='האטרקציה לא נמצאה';return}render({...p,map_query:p.map_query||p.location,source_url:p.operator_website_url||p.source_url,operator_website_url:p.operator_website_url||p.source_url})}).catch(()=>{document.getElementById('content').textContent='לא ניתן לטעון כרגע את הפרטים. נסו שוב מאוחר יותר.'});
})();
</script><script defer src="site-share.js?v=20261019-all-pages2"></script></body></html>
