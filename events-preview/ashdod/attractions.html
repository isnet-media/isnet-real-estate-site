<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121821"><title>אטרקציות באשדוד והסביבה | מה עושים באשדוד</title><meta name="description" content="מדריך אטרקציות קבועות באשדוד והסביבה לילדים, למשפחות ולמבוגרים: ספורט ימי, חדרי בריחה, משחקים, טבע ורכיבה."><style>*{box-sizing:border-box}body{margin:0;background:#111720;color:#f6f8fa;font-family:Arial,'Heebo',sans-serif;line-height:1.55}a{color:inherit}.wrap{max-width:1200px;margin:auto;padding:0 22px}header{background:#0b1119;border-bottom:1px solid #334356}header .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:18px;padding-bottom:18px}header a{text-decoration:none}.brand{font-weight:900;font-size:22px}.intro{padding:26px 0 12px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}h2{font-size:25px}.lead{color:#c9d5df;margin:0 0 20px}.controls{background:#1b2734;border:1px solid #385165;border-radius:18px;padding:16px;margin:12px 0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select{background:#0f1a25;border:1px solid #6f889a;border-radius:10px;color:#fff;min-height:49px;padding:12px;font:inherit}input{flex:1 1 270px}select{flex:1 1 180px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}.chips button{background:#202e3e;border:1px solid #51657b;border-radius:30px;color:#fff;font-size:15px;min-height:42px;padding:9px 15px;cursor:pointer}.chips button[aria-pressed=true]{background:#d5bce8;color:#211b2e;border-color:#d5bce8}.count{color:#d7e2ea;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-width:0;overflow:hidden;border:1px solid #3c4d60;border-radius:17px;background:#1b2633;display:flex;flex-direction:column}.media{height:205px;position:relative;background:linear-gradient(135deg,#274258,#223047);display:flex;align-items:center;justify-content:center}.media img{width:100%;height:100%;object-fit:contain}.media span{padding:20px;color:#d1dee9;font-weight:700;text-align:center}.body{padding:18px;display:flex;flex-direction:column;gap:9px;flex:1}.body h2{font-size:21px;line-height:1.35;margin:0}.body p{font-size:15px;color:#d0dce6;margin:0}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags small{padding:3px 9px;border-radius:15px;background:#2e4154;color:#dce8f5}.actions{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;gap:9px}.actions a{background:#d8bdf0;color:#251b30;border-radius:9px;text-decoration:none;padding:10px 13px;font-weight:800;font-size:14px}.actions .secondary{background:#31475a;color:#fff}.empty{padding:35px;border-radius:16px;background:#1b2633}.footer{margin:45px 0 65px;color:#aab9c8;font-size:14px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:0 14px}.media{height:210px}.controls{gap:10px}.chips{gap:6px}.chips button{padding:8px 10px;font-size:14px}}</style></head><body><header><div class="wrap"><a class="brand" href="./">מה עושים באשדוד</a><a href="category.html?category=kids">ילדים ומשפחה</a></div></header><main class="wrap"><section class="intro"><h1>אטרקציות באשדוד והסביבה</h1><p class="lead">מקומות ופעילויות קבועות שאפשר לתכנן אליהם בילוי — לילדים, למשפחות ולמבוגרים.</p></section><div class="controls"><input id="q" type="search" placeholder="חפשו מקום או סוג בילוי" aria-label="חיפוש אטרקציות"><select id="audience" aria-label="למי מתאים"><option value="all">לכולם</option><option value="kids">ילדים ומשפחה</option><option value="adults">מבוגרים</option></select><select id="area" aria-label="אזור"><option value="all">אשדוד והסביבה</option><option value="ashdod">אשדוד בלבד</option><option value="nearby">הסביבה הקרובה</option></select></div><nav class="chips" id="chips" aria-label="סוגי אטרקציות"></nav><p class="count" id="count" role="status"></p><div class="grid" id="grid"></div><p class="footer">המידע נבדק ממקורות המפעילים ומרישומי עסקים. זמינות, מחיר ומגבלות גיל עשויים להשתנות; לפני יציאה כדאי לתאם ישירות. אטרקציות סגורות אינן מוצגות.</p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const goodUrl=x=>{try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};const kinds={all:"הכול",water:"ים ושיט",escape:"חדרי בריחה",games:"משחקים ובאולינג",karaoke:"חדרי קריוקי",sport:"אקסטרים וספורט",horses:"רכיבה על סוסים",nature:"טבע ופארקים",culture:"מוזיאונים ותרבות",animals:"בעלי חיים"};let state={kind:"all",audience:new URLSearchParams(location.search).get("audience")==="kids"?"kids":"all",area:"all",q:""},entries=[];
function assignKind(x){const t=[x.name,(x.tags||[]).join(" ")].join(" ");return /רכיבה|חוות ליאון/.test(t)?"horses":/שיט|ים|גלישה|אדווה|לי־גל/.test(t)?"water":/בריחה|Secret/.test(t)?"escape":/באולינג|בבילון/.test(t)?"games":/סקייט|טיפוס|נינג'ה/.test(t)?"sport":/מוזיאון|מדע|דולפין/.test(t)?"culture":/דוגסנס|חי/.test(t)?"animals":"nature"}
function normalizePlaces(d){const seen=new Map();for(const [category,arr] of [["kids-attractions",d.categories?.["kids-attractions"]?.items||[]],["attractions",d.categories?.attractions?.items||[]]]){for(const x of arr){if(x.id==="skate-park"&&seen.has("kids-ashdod-skatepark"))continue;if(seen.has(x.id))continue;seen.set(x.id,{...x,id:x.id,kind:assignKind(x),audiences:["kids","adults"],area:/בית עזרא|כנות|גדרה|רחובות/.test(x.map_query||"")?"nearby":"ashdod",local:true,booking_url:x.booking_url||"",operator_website_url:x.operator_website_url||"",phone:x.phone||""})}}return [...seen.values()]}
function render(){const arr=entries.filter(x=>(state.kind==="all"||x.kind===state.kind)&&(state.audience==="all"||x.audiences.includes(state.audience))&&(state.area==="all"||x.area===state.area)&&[x.name,x.description,x.tagline,x.location].join(" ").toLowerCase().includes(state.q.toLowerCase()));document.getElementById("count").textContent=arr.length+" אטרקציות";document.getElementById("grid").innerHTML=arr.length?arr.map(x=>{let page="attraction.html?"+(x.local?"id=":"guide=")+encodeURIComponent(x.id),tel=String(x.phone||"").replace(/[^+0-9]/g,"");return '<article class="card"><div class="media">'+(goodUrl(x.image)?'<img loading="lazy" src="'+esc(goodUrl(x.image))+'" alt="'+esc(x.name)+'">':'<span>תמונת המקום תתווסף לאחר אימות</span>')+'</div><div class="body"><div class="tags"><small>'+esc(kinds[x.kind]||"אטרקציה")+'</small><small>'+esc(x.area==="nearby"?"הסביבה":"אשדוד")+'</small></div><h2>'+esc(x.name)+'</h2><p>'+esc((x.description||x.tagline||"").slice(0,175))+'</p><div class="actions"><a href="'+page+'">לפרטי האטרקציה ←</a>'+(tel?'<a class="secondary" href="tel:'+esc(tel)+'">☎ התקשרו</a>':'')+(goodUrl(x.booking_url)?'<a class="secondary" target="_blank" rel="noopener" href="'+esc(x.booking_url)+'">הזמנה ישירה ↗</a>':'')+'</div></div></article>'}).join(""):'<div class="empty">לא נמצאו אטרקציות בסינון שבחרתם.</div>';document.querySelectorAll("[data-kind]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.kind===state.kind)));}
document.getElementById("chips").innerHTML=Object.entries(kinds).map(([k,n])=>'<button type="button" data-kind="'+k+'" aria-pressed="'+(k==="all")+'">'+n+'</button>').join("");
document.getElementById("chips").addEventListener("click",e=>{let b=e.target.closest("[data-kind]");if(b){state.kind=b.dataset.kind;render()}});
document.getElementById("audience").value=state.audience;for(const k of ["audience","area"]){document.getElementById(k).addEventListener("change",e=>{state[k]=e.target.value;render()})}document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();render()});
Promise.all([fetch("data/places.json",{cache:"no-store"}).then(r=>r.json()),fetch("data/attractions-guide.json",{cache:"no-store"}).then(r=>r.json())]).then(([places,extra])=>{entries=[...normalizePlaces(places),...(extra.verified_sources||[]).map(x=>({...x,local:false,area:"ashdod"}))];render()}).catch(()=>{document.getElementById("grid").innerHTML='<div class="empty">לא ניתן לטעון כרגע את האטרקציות.</div>'});
</script></body></html>
