<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>בנק התמונות · ISNET</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth/config.js?v=20261007-1225"></script><script src="cms-db.js?v=media-v2"></script>
<style>body{font:16px Arial,sans-serif;background:#f3f6fb;color:#19283e;margin:0;padding:20px}main{max-width:1050px;margin:auto}a{color:#1757a2}.panel{background:#fff;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #17284015}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border:1px solid #c4cdd9;border-radius:8px}input{max-width:95%}button{background:#1556a7;color:#fff;cursor:pointer}button:disabled{opacity:.55}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}.table{overflow:auto}.muted{color:#57657a}#status{min-height:24px}</style></head><body><main><a href="index.html">← מערכת הניהול</a><h1>בנק התמונות המרכזי — גרסת ניסוי</h1><p class="muted">העלאה לאחסון פרטי. לא מתבצע פרסום אוטומטי באתר עד לאימות זכויות והתאמת התמונה לאירוע.</p><section class="panel"><h2>קליטת תמונה לבנק</h2><form id="form"><label>קובץ תמונה <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>סוג תמונה <select id="type"><option value="event_poster">פוסטר אירוע</option><option value="production">הפקה</option><option value="artist">אמן</option><option value="venue">מקום</option><option value="subcategory">תת־קטגוריה</option><option value="category">קטגוריה</option></select></label><label>כותרת <input id="title" required></label><label>קישור למקור התמונה <input id="source" type="url" placeholder="https://" required></label><label>קרדיט <input id="credit"></label><label>זכויות שימוש <select id="rights"><option value="unknown">לא אומת</option><option value="permission_required">נדרש אישור</option><option value="verified">אומת על ידי מנהל מורשה</option><option value="expired">פג תוקף</option></select></label><label>שיוכים (מזהה אירוע או category:music, artist:ID, production:ID) <input id="subjects"></label><button id="submit" type="submit">שמור בבנק</button></form><p role="status" id="status"></p></section><section class="panel"><h2>תמונות בבנק</h2><button id="refresh" type="button">רענון</button><p id="count"></p><div class="table"><table><thead><tr><th>תמונה</th><th>שם</th><th>סוג</th><th>זכויות</th><th>מקור</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script type="module">
import{requireAuth}from"./auth/guard.js?v=20261007-1225";
const auth=await requireAuth();const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{const assets=await ISNET_DB.listMediaAssets();$("count").textContent=assets.length+" תמונות";$("rows").innerHTML=assets.map(a=>'<tr><td><button type="button" class="preview" data-path="'+esc(a.object_path||"")+'">צפייה</button></td><td>'+esc(a.title)+'</td><td>'+esc(a.asset_type)+'</td><td>'+esc(a.rights_status)+'</td><td><a target="_blank" rel="noopener" href="'+esc(a.source_url)+'">מקור</a></td></tr>').join("");$("rows").querySelectorAll(".preview").forEach(b=>b.addEventListener("click",async()=>{try{const url=await ISNET_DB.mediaPreviewUrl(b.dataset.path);window.open(url,"_blank","noopener")}catch(e){$("status").textContent=e.message}}))}catch(e){$("status").textContent="לא ניתן לקרוא את המאגר: "+e.message}}
}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;$("status").textContent="מעלה תמונה...";try{const subjects=$("subjects").value.split(",").map(v=>v.trim()).filter(Boolean);await ISNET_DB.uploadMediaAsset($("file").files[0],{asset_type:$("type").value,title:$("title").value,source_url:$("source").value,image_credit:$("credit").value,rights_status:$("rights").value,subjects});$("status").textContent="התמונה נשמרה בבנק הפרטי. היא עדיין לא פורסמה באתר.";await load()}catch(err){$("status").textContent="שגיאה: "+err.message}finally{$("submit").disabled=false}});
$("refresh").addEventListener("click",load);
if(auth)load();
</script></body></html>
